name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      refToBuild:
        description: 'Branch, tag or commit SHA1 to build'
        required: true
        type: string
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  check-notebook-env:
    name: Test notebooks contain no embedded env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure test notebooks embed no Pluto project/manifest
        run: |
          if grep -rl 'PLUTO_PROJECT_TOML_CONTENTS\|PLUTO_MANIFEST_TOML_CONTENTS' test/notebooks; then
            echo "::error::Test notebooks must not embed a Pluto project/manifest; they regenerate in a fresh env. Enable the clean filter (git config filter.pluto-env-strip.clean .githooks/strip-pluto-env) and re-commit."
            exit 1
          fi
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}